# 조원 PC 흉내: 한글·공백 경로, .env 없음(bin/*.pyc 내장 키), run.bat 그대로, clips.json BOM.
# 영상은 release "ci-testdata-enc" 의 암호화 자산 + secret CI_DATA_PASS 로 푼다.
# 결과 zip(프레임 포함)은 같은 키로 암호화해 artifact 로 올린다. 채점은 내 PC 에서 tools/grade.py.
# 돌리기: gh workflow run windows.yml --ref ci
name: windows

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    env:
      W: C:\Users\runneradmin\바탕 화면\rateCV
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-ascii

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg (조원과 같은 gyan 판)
        run: choco install ffmpeg -y --no-progress

      - name: 한글·공백 경로로 복사
        run: |
          New-Item -ItemType Directory -Force "$env:W" | Out-Null
          Copy-Item -Recurse -Force * "$env:W"
          Get-ChildItem "$env:W"
          Format-Hex "$env:W\run.bat" | Select-Object -First 2

      - name: 영상 받기·풀기
        env:
          GH_TOKEN: ${{ github.token }}
          PASS: ${{ secrets.CI_DATA_PASS }}
        run: |
          gh release download ci-testdata-enc -D enc -p "*.enc"
          if ($LASTEXITCODE) { exit 1 }
          $ossl = @("C:\Program Files\Git\usr\bin\openssl.exe", "C:\Program Files\OpenSSL\bin\openssl.exe", "C:\Program Files\Git\mingw64\bin\openssl.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          & $ossl version
          New-Item -ItemType Directory -Force "$env:W\data\raw" | Out-Null
          Get-ChildItem enc\*.enc | ForEach-Object {
            & $ossl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in $_.FullName -out ("enc\" + $_.BaseName) -pass env:PASS
            if ($LASTEXITCODE) { exit 1 }
            Move-Item ("enc\" + $_.BaseName) "$env:W\data\raw\"
          }
          Get-ChildItem "$env:W\data\raw"

      - name: clips.json (PowerShell 5 는 BOM 을 붙인다)
        run: |
          $team = "3" + [char]0xC870
          '{"team": "' + $team + '", "clips": {"cold": {"stem": "20260824_142918", "T_C": 14.2}, "rt": {"stem": "20260824_144012", "T_C": 27.2}, "hot": {"stem": "20260824_142727", "T_C": 54.7}}}' | Set-Content -Encoding utf8 "$env:W\data\raw\clips.json"
          Format-Hex "$env:W\data\raw\clips.json" | Select-Object -First 1

      - name: run.bat (1회차)
        shell: cmd
        run: |
          cd /d "%W%"
          call run.bat --no-video < NUL
          set RC=%errorlevel%
          copy /y "%W%\results\run_log.txt" "%W%-run1_log.txt"
          if not "%RC%"=="0" exit /b %RC%
          if not exist "%W%\submit_*.zip" exit /b 1

      - name: run.bat (2회차 — 프레임 재사용)
        shell: cmd
        run: |
          cd /d "%W%"
          call run.bat --no-video < NUL
          if errorlevel 1 exit /b 1
          dir /b "%W%\submit_*.zip"
          for /f %%c in ('dir /b "%W%\submit_*.zip" ^| find /c /v ""') do if %%c LSS 2 exit /b 1

      - name: 한 영상 이어찍기 (자동 분할)
        run: |
          $O = "$env:W-one"
          Copy-Item -Recurse -Force "$env:W" $O
          Remove-Item -Recurse -Force "$O\.venv", "$O\data\frames", "$O\results", "$O\submit_*.zip" -ErrorAction SilentlyContinue
          Set-Location "$O\data\raw"
          "file '20260824_142918.mp4'", "file '20260824_144012.mp4'", "file '20260824_142727.mp4'" | Set-Content -Encoding ascii list.txt
          ffmpeg -v error -f concat -safe 0 -i list.txt -c copy -an one.mp4
          if ($LASTEXITCODE) { exit 1 }
          Remove-Item 2026*.mp4, list.txt
          $team = "3" + [char]0xC870
          '{"team": "' + $team + '", "clips": {"cold": {"stem": "one", "T_C": 14.2}, "rt": {"stem": "one", "T_C": 27.2}, "hot": {"stem": "one", "T_C": 54.7}}}' | Set-Content -Encoding utf8 clips.json
          Set-Location $O
          cmd /c "run.bat --no-video < NUL"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (!(Test-Path "$O\submit_*.zip")) { exit 1 }

      - name: 결과 모으기 (프레임이 들어 있으니 암호화해서 올린다)
        if: always()
        env:
          PASS: ${{ secrets.CI_DATA_PASS }}
        run: |
          $ossl = @("C:\Program Files\Git\usr\bin\openssl.exe", "C:\Program Files\OpenSSL\bin\openssl.exe", "C:\Program Files\Git\mingw64\bin\openssl.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          New-Item -ItemType Directory -Force tmp, up | Out-Null
          Write-Output "===== sep run1 run_log.txt"
          Get-Content -Encoding utf8 -ErrorAction SilentlyContinue "$env:W-run1_log.txt"
          foreach ($p in @(@("sep", $env:W), @("one", "$env:W-one"))) {
            $tag = $p[0]; $dir = $p[1]
            foreach ($f in "results.txt", "run_log.txt") {
              Write-Output "===== $tag $f"
              Get-Content -Encoding utf8 -ErrorAction SilentlyContinue "$dir\results\$f"
            }
            $i = 0
            Get-ChildItem -ErrorAction SilentlyContinue "$dir\submit_*.zip" | ForEach-Object {
              Write-Output "$tag $($_.Name) $($_.Length)"
              Copy-Item $_.FullName "tmp\$tag.$i.zip"; $i++
            }
            if (Test-Path "$dir\results") { Compress-Archive -Path "$dir\results" -DestinationPath "tmp\$tag.results.zip" }
          }
          Get-ChildItem tmp\*.zip | ForEach-Object {
            & $ossl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in $_.FullName -out ("up\" + $_.Name + ".enc") -pass env:PASS
          }
          Get-ChildItem up

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-windows-enc
          path: up/
          retention-days: 3
          if-no-files-found: warn
