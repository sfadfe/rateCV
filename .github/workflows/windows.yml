# Windows 러너에서 처음부터 끝까지 돌려 내 PC 값(ci/reference.json)과 ±4% 안에 드는지 본다.
# 영상은 release "testdata" 의 자산에서 받는다 (gh release create testdata data/raw/*.mp4).
name: windows

# ci 브랜치에만 있다. 돌리기: gh workflow run windows.yml --ref ci
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: ci 브랜치의 기준값·워크플로만 가져오기
        run: git fetch -q origin ci && git checkout origin/ci -- ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: 영상 받기 (release testdata)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download testdata -D data/raw -p "*.mp4"
          Get-ChildItem data/raw

      - name: 서명키 (임시)
        run: python -c "import secrets,pathlib;pathlib.Path('.env').write_text('MFOAM_PROV_KEY='+secrets.token_hex(32)+'\n')"

      - name: 패키지
        run: python -m pip install -q -r requirements.txt

      - name: run.py
        run: python run.py --no-video

      - name: 내 PC 값과 비교
        run: |
          Copy-Item ci/reference.json results/reference.json
          python src/verify.py

      - name: summary
        if: always()
        run: Get-Content results/summary.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-windows
          path: |
            results/
            submit_*.zip
          if-no-files-found: warn
